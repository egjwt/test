# GitHub에 코드가 올라오면 Railway에 자동으로 배포합니다.
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에 RAILWAY_TOKEN (Railway 프로젝트 토큰)
name: Deploy to Railway

on:
  push:
    branches: [claude/exciting-fermi-h7bit3]
  workflow_dispatch: {}

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: test
    steps:
      - name: Check token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN 시크릿이 없습니다. 저장소 Settings > Secrets and variables > Actions 에 추가해 주세요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --ci
