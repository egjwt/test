<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>스탠바이 관리자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: login card alone; after login, stats strip on top, then a two-column grid of control panels */
:root {
  --bg: #f3f5fa; --surface: #ffffff; --fg: #141a2b; --muted: #5d667d; --line: #d9deea;
  --accent: #2443c9; --accent-soft: #e5eaff; --hot: #d6342a; --hot-soft: #fde9e7; --ok: #18815a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1220; --surface: #171c2d; --fg: #e8ebf4; --muted: #98a1b8; --line: #2a3149;
  --accent: #7d95ff; --accent-soft: #232c52; --hot: #ff6b5e; --hot-soft: #3a1d22; --ok: #4cc993; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #171c2d; --fg: #e8ebf4; --muted: #98a1b8; --line: #2a3149;
  --accent: #7d95ff; --accent-soft: #232c52; --hot: #ff6b5e; --hot-soft: #3a1d22; --ok: #4cc993; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.wrap.narrow { max-width: 440px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0; }
a { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
input[type="text"], input[type="password"], input[type="datetime-local"], textarea {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 70px; }
button {
  font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px; padding: 8px 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button { white-space: nowrap; flex: none; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.danger { background: var(--hot); border-color: var(--hot); color: var(--surface); }
button.ghost-danger { color: var(--hot); }
button.icon { padding: 4px 8px; font-size: 13px; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.switch { flex-direction: row; align-items: center; gap: 8px; color: var(--fg); font-size: 14px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.msg { font-size: 13.5px; min-height: 1.4em; margin: 0; }
.msg.err { color: var(--hot); } .msg.ok { color: var(--ok); }
.badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--ok); color: var(--ok); }
.badge.off { border-color: var(--line); color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.links li input[type="text"]:first-child { flex: 0 0 34%; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-num); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat small { color: var(--muted); font-size: 12.5px; }
.week { overflow-x: auto; }
.week table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.week th, .week td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.week th:first-child, .week td:first-child { text-align: left; }
.week th { color: var(--muted); font-weight: 500; }
.bar { display: inline-block; height: 8px; border-radius: 2px; background: var(--accent); vertical-align: middle; margin-right: 6px; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.items li { display: flex; gap: 6px; align-items: center; }
.items li input[type="text"] { flex: 1; padding: 6px 9px; font-size: 14px; }
.items li.dirty input[type="text"] { border-color: var(--accent); }
.items .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.confirm { background: var(--hot-soft); border: 1px solid var(--hot); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; font-size: 14px; }
.preview { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.preview b { color: var(--accent); font-size: 12px; letter-spacing: 0.08em; margin-right: 8px; }

@media (max-width: 760px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="wrap narrow" id="wrap">
  <header>
    <h1>스탠바이 관리자</h1>
    <div class="row">
      <a class="sub" href="/">← 메인 화면</a>
      <span class="badge" id="adminBadge" hidden>관리자 로그인됨</span>
      <button type="button" id="logoutBtn" class="icon" hidden>로그아웃</button>
    </div>
  </header>

  <!-- 로그인 -->
  <section class="card" id="loginCard" hidden>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:14px">
      <label for="pw">관리자 비밀번호
        <input type="password" id="pw" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit" id="loginBtn">로그인</button>
    </form>
    <p class="msg" id="loginMsg"></p>
  </section>

  <!-- 관리자 화면 -->
  <div id="adminArea" hidden style="display:flex;flex-direction:column;gap:18px">
    <section class="card" aria-labelledby="h-stats">
      <div class="head"><h2 id="h-stats">오늘 현황</h2><button type="button" class="icon" id="refreshBtn">새로고침</button></div>
      <div class="stats">
        <div class="stat"><b id="stVisitors">0</b><small>오늘 방문자</small></div>
        <div class="stat"><b id="stViews">0</b><small>오늘 페이지 조회</small></div>
        <div class="stat"><b id="stCaptcha">0</b><small>오늘 보안문자 연습</small></div>
        <div class="stat"><b id="stSeat">0</b><small>오늘 좌석 연습</small></div>
        <div class="stat"><b id="stChecks">0</b><small>오늘 체크한 횟수</small></div>
      </div>
      <p class="sub" id="stDone"></p>
      <div class="week">
        <table>
          <thead><tr><th>날짜 (한국 시간)</th><th>방문자</th><th>조회</th><th>보안문자</th><th>좌석</th><th>체크</th></tr></thead>
          <tbody id="weekBody"></tbody>
        </table>
      </div>
    </section>

    <div class="grid">
      <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
        <section class="card" aria-labelledby="h-notice">
          <div class="head"><h2 id="h-notice">공지 배너</h2><span class="badge off" id="noticeBadge">꺼짐</span></div>
          <label for="noticeText">메인 화면 맨 위에 보일 문구 (300자 이내)
            <textarea id="noticeText" maxlength="300" placeholder="예: 오늘 20시 ○○ 콘서트 2차 오픈! 10분 전에 미리 로그인해 두세요."></textarea>
          </label>
          <label class="switch"><input type="checkbox" id="noticeOn"> 메인 화면에 표시</label>
          <div class="preview" id="noticePreview" hidden><b>공지</b><span id="noticePreviewText"></span></div>
          <div class="row"><button class="primary" type="button" id="noticeSave">저장</button></div>
          <p class="msg" id="noticeMsg"></p>
        </section>

        <section class="card" aria-labelledby="h-event">
          <div class="head"><h2 id="h-event">공연·오픈일시</h2><span class="badge off" id="eventBadge">미지정</span></div>
          <p class="sub" style="margin:0">저장하면 모든 방문자의 카운트다운이 이 시각으로 맞춰집니다. 방문자가 직접 바꾼 값은 다음에 관리자가 시각을 바꿀 때까지 유지돼요.</p>
          <label for="eventTitle">공연 이름
            <input type="text" id="eventTitle" maxlength="100" placeholder="예: ○○ 콘서트 서울 공연">
          </label>
          <label for="eventAt">오픈 일시 (이 기기 시간대 기준)
            <input type="datetime-local" id="eventAt" step="1">
          </label>
          <div class="row">
            <button class="primary" type="button" id="eventSave">저장</button>
            <button type="button" id="eventClear">지정 해제</button>
          </div>
          <p class="msg" id="eventMsg"></p>
        </section>

        <section class="card" aria-labelledby="h-links">
          <div class="head"><h2 id="h-links">예매처 링크</h2><span class="sub" id="linkCount">0개</span></div>
          <p class="sub" style="margin:0">메인 화면 위쪽 "예매처 바로가기"에 보이는 링크예요. 누르면 새 탭에서 열립니다.</p>
          <ul class="items links" id="links"></ul>
          <div class="row">
            <button type="button" id="linkAdd">링크 추가</button>
            <button type="button" id="linkDefaults">기본 4곳으로</button>
            <button class="primary" type="button" id="linkSave">저장</button>
          </div>
          <p class="msg" id="linkMsg"></p>
        </section>
      </div>

      <section class="card" aria-labelledby="h-items">
        <div class="head"><h2 id="h-items">체크리스트 관리</h2><span class="sub" id="itemCount">0개</span></div>
        <label class="switch"><input type="checkbox" id="lockOn"> 방문자는 체크만 가능 (추가·삭제 잠금)</label>
        <ul class="items" id="items"></ul>
        <form class="row" id="addForm" style="flex-wrap:nowrap">
          <input type="text" id="newItem" maxlength="200" placeholder="새 항목">
          <button type="submit">추가</button>
        </form>
        <div class="row">
          <button type="button" id="saveEdits" class="primary" disabled>수정 내용 저장</button>
          <button type="button" id="restoreBtn">기본 항목으로 복원</button>
          <button type="button" id="clearBtn" class="ghost-danger">전부 삭제</button>
        </div>
        <div class="confirm" id="confirmBox" hidden>
          <p id="confirmText"></p>
          <div class="row">
            <button class="danger" type="button" id="confirmYes">확인</button>
            <button type="button" id="confirmNo">취소</button>
          </div>
        </div>
        <p class="msg" id="itemsMsg"></p>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  async function api(method, url, body) {
    const r = await fetch(url, {
      method, cache: 'no-store', credentials: 'same-origin',
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    let data = null; try { data = await r.json(); } catch {}
    if (r.status === 401 && url !== '/api/admin/login') { showLogin('로그인이 만료됐어요. 다시 로그인해 주세요.', 'err'); throw new Error('로그인이 필요해요.'); }
    if (!r.ok) throw new Error((data && data.error) || '요청이 실패했어요.');
    return data;
  }
  function msg(id, text, kind) { const el = $(id); el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); }
  const pad = n => String(n).padStart(2, '0');
  function toLocalInput(ms) {
    const d = new Date(ms);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  /* ---------- 화면 전환 ---------- */
  function showLogin(text, kind) {
    $('#wrap').classList.add('narrow');
    $('#adminArea').hidden = true; $('#adminBadge').hidden = true; $('#logoutBtn').hidden = true;
    $('#loginCard').hidden = false;
    msg('#loginMsg', text || '', kind); $('#pw').focus();
  }
  function showAdmin(snap) {
    $('#wrap').classList.remove('narrow');
    $('#loginCard').hidden = true;
    $('#adminArea').hidden = false; $('#adminBadge').hidden = false; $('#logoutBtn').hidden = false;
    applySnapshot(snap);
  }

  /* ---------- 데이터 반영 ---------- */
  let items = [];
  function applySnapshot(s) {
    items = s.items;
    renderStats(s.stats);
    $('#noticeText').value = s.notice.text || ''; $('#noticeOn').checked = !!s.notice.on; updateNoticeUi(s.notice);
    $('#eventTitle').value = s.event.title || ''; $('#eventAt').value = s.event.openAt ? toLocalInput(s.event.openAt) : '';
    updateEventUi(s.event);
    $('#lockOn').checked = !!s.settings.lockChecklist;
    links = (s.links || []).map(l => ({ ...l })); renderLinks();
    items = s.items; renderItems();
  }
  function renderStats(st) {
    $('#stVisitors').textContent = st.today.visitors;
    $('#stViews').textContent = st.today.views;
    $('#stCaptcha').textContent = st.today.captcha;
    $('#stSeat').textContent = st.today.seat || 0;
    $('#stChecks').textContent = st.today.checks;
    $('#stDone').textContent = `체크리스트 ${items.length || '-'}개 중 ${st.done}개가 지금 체크되어 있어요.`;
    const max = Math.max(1, ...st.last7.map(d => d.visitors));
    $('#weekBody').innerHTML = '';
    st.last7.slice().reverse().forEach(d => {
      const tr = document.createElement('tr');
      const w = Math.round(d.visitors / max * 60);
      tr.innerHTML = `<td>${d.day}</td><td><span class="bar" style="width:${w}px"></span>${d.visitors}</td><td>${d.views}</td><td>${d.captcha}</td><td>${d.seat || 0}</td><td>${d.checks}</td>`;
      $('#weekBody').append(tr);
    });
  }
  function updateNoticeUi(n) {
    const on = n.on && n.text;
    $('#noticeBadge').textContent = on ? '표시 중' : '꺼짐';
    $('#noticeBadge').className = 'badge' + (on ? '' : ' off');
    $('#noticePreview').hidden = !on; $('#noticePreviewText').textContent = n.text || '';
  }
  function updateEventUi(e) {
    const on = !!e.openAt;
    $('#eventBadge').textContent = on ? new Date(e.openAt).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '미지정';
    $('#eventBadge').className = 'badge' + (on ? '' : ' off');
  }

  /* ---------- 체크리스트 편집 ---------- */
  const dirty = new Map(); // id -> 새 문구
  function renderItems() {
    const ul = $('#items'); ul.innerHTML = '';
    $('#itemCount').textContent = items.length + '개';
    if (!items.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '항목이 없어요.'; ul.append(li); }
    items.forEach((it, i) => {
      const li = document.createElement('li');
      const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 200; inp.id = 'item-' + it.id;
      inp.value = dirty.has(it.id) ? dirty.get(it.id) : it.t; inp.setAttribute('aria-label', `${i + 1}번 항목`);
      if (dirty.has(it.id)) li.className = 'dirty';
      inp.addEventListener('input', () => {
        if (inp.value.trim() && inp.value.trim() !== it.t) dirty.set(it.id, inp.value); else dirty.delete(it.id);
        li.className = dirty.has(it.id) ? 'dirty' : ''; $('#saveEdits').disabled = !dirty.size;
      });
      const up = btn('↑', `${i + 1}번 위로`, () => move(i, -1)); up.disabled = i === 0;
      const down = btn('↓', `${i + 1}번 아래로`, () => move(i, 1)); down.disabled = i === items.length - 1;
      const del = btn('삭제', `${i + 1}번 삭제`, () => removeItem(it)); del.classList.add('ghost-danger');
      li.append(inp, up, down, del); ul.append(li);
    });
    $('#saveEdits').disabled = !dirty.size;
  }
  function btn(text, label, fn) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'icon'; b.textContent = text;
    b.setAttribute('aria-label', label); b.addEventListener('click', fn); return b;
  }
  async function move(i, dir) {
    const j = i + dir; if (j < 0 || j >= items.length) return;
    const next = items.slice(); [next[i], next[j]] = [next[j], next[i]];
    try { items = (await api('PUT', '/api/admin/items/order', { ids: next.map(x => x.id) })).items; renderItems(); }
    catch (e) { msg('#itemsMsg', e.message, 'err'); }
  }
  async function removeItem(it) {
    try { await api('DELETE', '/api/items/' + it.id); items = items.filter(x => x !== it); dirty.delete(it.id); renderItems(); msg('#itemsMsg', '항목을 삭제했어요.', 'ok'); }
    catch (e) { msg('#itemsMsg', e.message, 'err'); }
  }
  $('#saveEdits').addEventListener('click', async () => {
    const entries = [...dirty.entries()]; let ok = 0;
    for (const [id, t] of entries) {
      try { const r = await api('PATCH', '/api/admin/items/' + id, { t }); const it = items.find(x => x.id === id); if (it) it.t = r.t; dirty.delete(id); ok++; }
      catch (e) { msg('#itemsMsg', e.message, 'err'); }
    }
    renderItems(); if (ok) msg('#itemsMsg', `${ok}개 항목을 수정했어요.`, 'ok');
  });
  $('#addForm').addEventListener('submit', async e => {
    e.preventDefault(); const t = $('#newItem').value.trim(); if (!t) return;
    try { items.push(await api('POST', '/api/items', { t })); $('#newItem').value = ''; renderItems(); msg('#itemsMsg', '항목을 추가했어요.', 'ok'); }
    catch (err) { msg('#itemsMsg', err.message, 'err'); }
  });
  $('#lockOn').addEventListener('change', async () => {
    const v = $('#lockOn').checked;
    try { await api('PUT', '/api/admin/settings', { lockChecklist: v }); msg('#itemsMsg', v ? '방문자의 추가·삭제를 잠갔어요.' : '방문자도 추가·삭제할 수 있어요.', 'ok'); }
    catch (e) { $('#lockOn').checked = !v; msg('#itemsMsg', e.message, 'err'); }
  });

  /* 되돌릴 수 없는 작업은 한 번 더 확인 */
  let pending = null;
  function ask(text, fn) { pending = fn; $('#confirmText').textContent = text; $('#confirmBox').hidden = false; $('#confirmNo').focus(); }
  $('#confirmNo').addEventListener('click', () => { pending = null; $('#confirmBox').hidden = true; });
  $('#confirmYes').addEventListener('click', async () => {
    const fn = pending; pending = null; $('#confirmBox').hidden = true; if (fn) await fn();
  });
  $('#clearBtn').addEventListener('click', () => ask(`체크리스트 항목 ${items.length}개를 모두 지웁니다. 되돌릴 수 없어요.`, async () => {
    try { const r = await api('DELETE', '/api/admin/items'); items = r.items; dirty.clear(); renderItems(); msg('#itemsMsg', `할 일 ${r.removed}개를 모두 삭제했어요.`, 'ok'); }
    catch (e) { msg('#itemsMsg', e.message, 'err'); }
  }));
  $('#restoreBtn').addEventListener('click', () => ask(`지금 항목 ${items.length}개를 지우고 기본 항목 11개로 되돌립니다.`, async () => {
    try { items = (await api('POST', '/api/admin/items/restore-defaults', {})).items; dirty.clear(); renderItems(); msg('#itemsMsg', '기본 항목으로 복원했어요.', 'ok'); }
    catch (e) { msg('#itemsMsg', e.message, 'err'); }
  }));

  /* ---------- 예매처 링크 ---------- */
  const DEFAULT_LINKS = [
    { name: '멜론티켓', url: 'https://ticket.melon.com' },
    { name: 'YES24 티켓', url: 'https://ticket.yes24.com' },
    { name: 'NOL 티켓', url: 'https://tickets.interpark.com' },
    { name: '티켓링크', url: 'https://www.ticketlink.co.kr' },
  ];
  let links = [];
  function renderLinks() {
    const ul = $('#links'); ul.innerHTML = '';
    $('#linkCount').textContent = links.length + '개';
    if (!links.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '링크가 없어요. 메인 화면에서 바로가기가 숨겨져요.'; ul.append(li); }
    links.forEach((l, i) => {
      const li = document.createElement('li');
      const name = document.createElement('input'); name.type = 'text'; name.maxLength = 20; name.value = l.name; name.placeholder = '이름'; name.id = 'link-name-' + i;
      name.setAttribute('aria-label', `${i + 1}번 링크 이름`); name.addEventListener('input', () => { l.name = name.value; });
      const url = document.createElement('input'); url.type = 'text'; url.maxLength = 300; url.value = l.url; url.placeholder = 'https://'; url.id = 'link-url-' + i;
      url.setAttribute('aria-label', `${i + 1}번 링크 주소`); url.addEventListener('input', () => { l.url = url.value; });
      const up = btn('↑', `${i + 1}번 링크 위로`, () => { [links[i - 1], links[i]] = [links[i], links[i - 1]]; renderLinks(); }); up.disabled = i === 0;
      const del = btn('삭제', `${i + 1}번 링크 삭제`, () => { links.splice(i, 1); renderLinks(); }); del.classList.add('ghost-danger');
      li.append(name, url, up, del); ul.append(li);
    });
    $('#linkAdd').disabled = links.length >= 12;
  }
  $('#linkAdd').addEventListener('click', () => { links.push({ name: '', url: '' }); renderLinks(); $('#link-name-' + (links.length - 1)).focus(); });
  $('#linkDefaults').addEventListener('click', () => { links = DEFAULT_LINKS.map(l => ({ ...l })); renderLinks(); msg('#linkMsg', '기본 4곳으로 채웠어요. 저장을 눌러야 적용돼요.'); });
  $('#linkSave').addEventListener('click', async () => {
    try { links = (await api('PUT', '/api/admin/links', { links })).links.map(l => ({ ...l })); renderLinks(); msg('#linkMsg', '저장했어요. 메인 화면에 곧 반영돼요.', 'ok'); }
    catch (e) { msg('#linkMsg', e.message, 'err'); }
  });

  /* ---------- 공지 ---------- */
  $('#noticeSave').addEventListener('click', async () => {
    const text = $('#noticeText').value.trim(), on = $('#noticeOn').checked;
    if (on && !text) return msg('#noticeMsg', '표시하려면 문구를 입력해 주세요.', 'err');
    try { const n = await api('PUT', '/api/admin/notice', { text, on }); updateNoticeUi(n); msg('#noticeMsg', on ? '공지를 메인 화면에 띄웠어요.' : '공지를 저장했어요. 지금은 숨겨져 있어요.', 'ok'); }
    catch (e) { msg('#noticeMsg', e.message, 'err'); }
  });

  /* ---------- 공연·오픈일시 ---------- */
  $('#eventSave').addEventListener('click', async () => {
    const v = $('#eventAt').value;
    if (!v) return msg('#eventMsg', '오픈 일시를 골라 주세요.', 'err');
    const openAt = new Date(v).getTime();
    if (isNaN(openAt)) return msg('#eventMsg', '오픈 일시가 올바르지 않아요.', 'err');
    try { const e = await api('PUT', '/api/admin/event', { title: $('#eventTitle').value.trim(), openAt }); updateEventUi(e); msg('#eventMsg', '저장했어요. 방문자 화면에 곧 반영돼요.', 'ok'); }
    catch (e) { msg('#eventMsg', e.message, 'err'); }
  });
  $('#eventClear').addEventListener('click', async () => {
    try { const e = await api('PUT', '/api/admin/event', { title: '', openAt: null }); $('#eventTitle').value = ''; $('#eventAt').value = ''; updateEventUi(e); msg('#eventMsg', '지정을 해제했어요. 방문자가 각자 정한 시각을 써요.', 'ok'); }
    catch (e) { msg('#eventMsg', e.message, 'err'); }
  });

  /* ---------- 로그인 ---------- */
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const b = $('#loginBtn'); b.disabled = true;
    try { const snap = await api('POST', '/api/admin/login', { password: $('#pw').value }); $('#pw').value = ''; showAdmin(snap); }
    catch (err) { msg('#loginMsg', err.message, 'err'); $('#pw').select(); }
    finally { b.disabled = false; }
  });
  $('#logoutBtn').addEventListener('click', async () => {
    try { await api('POST', '/api/admin/logout', {}); } catch {}
    showLogin('로그아웃했어요.', 'ok');
  });
  $('#refreshBtn').addEventListener('click', async () => {
    try { const st = await api('GET', '/api/admin/stats'); renderStats(st); } catch {}
  });

  (async () => {
    try {
      const me = await api('GET', '/api/admin/me');
      if (!me.configured) {
        showLogin('서버에 ADMIN_PASSWORD 환경변수가 없어서 로그인할 수 없어요. Railway Variables에 추가해 주세요.', 'err');
        $('#loginBtn').disabled = true; return;
      }
      if (me.loggedIn) showAdmin(me); else showLogin();
    } catch { showLogin('서버에 연결하지 못했어요. 잠시 뒤 새로고침해 주세요.', 'err'); }
  })();
})();
</script>
</body>
</html>
